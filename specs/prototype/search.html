<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PokeTrade — Search &amp; add cards</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/components.css" />
</head>
<body>
  <div class="app-shell" id="app-shell-root"></div>

  <!-- Add to Collection modal -->
  <div class="modal-overlay" id="addOverlay" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div class="modal-panel">
      <div class="modal-head">
        <h3 id="addTitle">Add to collection</h3>
        <button class="btn-icon" id="addClose" aria-label="Close">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="modal-hero">
        <div class="thumb" id="addThumb"></div>
        <div>
          <h2 id="addName" style="font-size:1.125rem;"></h2>
          <p class="card-meta" id="addSet"></p>
        </div>
      </div>
      <div class="field">
        <label for="addCondition">Condition</label>
        <select id="addCondition">
          <option>Near Mint</option>
          <option>Lightly Played</option>
          <option>Moderately Played</option>
          <option>Damaged</option>
        </select>
      </div>
      <div class="field">
        <span>Quantity</span>
        <div class="stepper">
          <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
          <output id="qtyValue">1</output>
          <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <div class="field">
        <span>Card photo (optional)</span>
        <button type="button" class="btn btn-secondary" style="justify-content: flex-start;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg>
          Upload a photo
        </button>
        <p class="field-hint">We'll use this instead of the catalog picture once it's uploaded.</p>
      </div>
      <button class="btn btn-primary btn-block" id="confirmAdd">Add to collection</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="assets/app.js"></script>
  <script>
    if (PokeTradeProto.requireAuthOrRedirect()) {
      PokeTradeProto.renderShell('search', { title: 'Search &amp; add cards' });

      var panel = document.getElementById('app-panel-root');
      panel.innerHTML =
        '<div class="steps">' +
        '<div class="step"><span class="step-num">1</span><p><strong>Search</strong>Type a name, set code, or number.</p></div>' +
        '<div class="step"><span class="step-num">2</span><p><strong>Pick the printing</strong>Match language, set, and variant.</p></div>' +
        '<div class="step"><span class="step-num">3</span><p><strong>Add it</strong>Set condition and quantity.</p></div>' +
        '</div>' +
        '<form class="search-form" id="searchForm">' +
        '<label for="searchInput" class="visually-hidden">Search the catalog</label>' +
        '<input id="searchInput" placeholder="Try “Charizard”, “Pikachu”, or “Mew”" />' +
        '<button type="submit" class="btn btn-primary">Search</button>' +
        '</form>' +
        '<div id="searchResults" aria-live="polite"></div>';

      document.getElementById('searchForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var q = document.getElementById('searchInput').value.trim().toLowerCase();
        var container = document.getElementById('searchResults');
        var match = Object.keys(PokeTradeProto.SEARCH_INDEX).find(function (k) { return q.indexOf(k) !== -1; });
        if (!match) {
          container.innerHTML = '<div class="empty-state">' + PokeTradeProto.strings.noResults + '</div>';
          return;
        }
        var results = PokeTradeProto.SEARCH_INDEX[match];
        container.innerHTML = '<div class="result-list">' + results.map(function (r, i) {
          return (
            '<div class="result-row">' +
            '<div class="thumb type-' + r.type + '">' + (r.type === 'placeholder' ? '' : r.name.charAt(0)) + '</div>' +
            '<div class="result-info"><strong>' + r.name + '</strong><div class="card-meta">' + r.set + ' · ' + r.number + ' · ' + r.rarity + '</div>' +
            (results.length > 1 ? '<div class="tag-row">' + r.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div>' : '<div class="tag-row"><span class="tag">' + r.tags.join(' · ') + '</span></div>') +
            '</div>' +
            '<button type="button" class="btn btn-secondary" data-result-index="' + i + '">Add</button>' +
            '</div>'
          );
        }).join('') + '</div>';
        Array.prototype.forEach.call(container.querySelectorAll('[data-result-index]'), function (btn) {
          btn.addEventListener('click', function () { openAdd(results[Number(btn.dataset.resultIndex)], match); });
        });
      });

      var addOverlay = document.getElementById('addOverlay');
      var qty = 1;
      var pendingResult = null, pendingId = null;
      function openAdd(result, idBase) {
        pendingResult = result;
        pendingId = idBase;
        document.getElementById('addName').textContent = result.name;
        document.getElementById('addSet').textContent = result.set + ' · ' + result.tags.join(' · ');
        document.getElementById('addThumb').className = 'thumb type-' + result.type;
        document.getElementById('addThumb').textContent = result.type === 'placeholder' ? '' : result.name.charAt(0);
        qty = 1;
        document.getElementById('qtyValue').textContent = qty;
        addOverlay.classList.add('is-open');
        document.getElementById('addClose').focus();
      }
      function closeAdd() { addOverlay.classList.remove('is-open'); }
      document.getElementById('addClose').addEventListener('click', closeAdd);
      addOverlay.addEventListener('click', function (e) { if (e.target === addOverlay) closeAdd(); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && addOverlay.classList.contains('is-open')) closeAdd(); });
      document.getElementById('qtyMinus').addEventListener('click', function () { qty = Math.max(1, qty - 1); document.getElementById('qtyValue').textContent = qty; });
      document.getElementById('qtyPlus').addEventListener('click', function () { qty = qty + 1; document.getElementById('qtyValue').textContent = qty; });
      document.getElementById('confirmAdd').addEventListener('click', function () {
        if (!pendingResult) return;
        PokeTradeProto.addToCollection({
          id: pendingId,
          name: pendingResult.name, set: pendingResult.set, number: pendingResult.number,
          rarity: pendingResult.rarity, language: pendingResult.tags[0] || 'English', type: pendingResult.type,
          qty: qty, condition: document.getElementById('addCondition').value,
          price: null, updated: 'Just now', source: 'TCGdex',
          signal: 'yellow', signalLabel: 'New', signalDesc: 'Price not fetched yet for this new entry.',
          rare: pendingResult.rarity.toLowerCase().indexOf('rare') !== -1, history: []
        });
        closeAdd();
        PokeTradeProto.showToast(PokeTradeProto.strings.added);
      });
    }
  </script>
</body>
</html>
