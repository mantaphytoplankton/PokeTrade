<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PokeTrade — Log in</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="assets/tokens.css" />
<link rel="stylesheet" href="assets/components.css" />
<style>
  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6); }
  .auth-card {
    width: 100%; max-width: 400px;
    background: var(--paper-raised); border: var(--outline); border-radius: var(--radius-card);
    box-shadow: var(--sticker-shadow); padding: var(--space-8) var(--space-6);
    display: flex; flex-direction: column; gap: var(--space-6);
  }
  .wordmark { justify-content: center; }
  .auth-tabs { display: flex; gap: var(--space-2); background: var(--neutral-100); border-radius: var(--radius-pill); padding: 4px; }
  .auth-tabs button { flex: 1; border: none; background: transparent; border-radius: var(--radius-pill); padding: var(--space-2) var(--space-3); font-weight: 700; color: var(--ink-soft); cursor: pointer; min-height: 44px; }
  .auth-tabs button[aria-selected="true"] { background: var(--paper-raised); color: var(--ink); box-shadow: var(--sticker-shadow); }
</style>
</head>
<body>
  <section class="auth-screen" id="screen-auth">
    <div class="auth-card">
      <div class="wordmark">Poke<span class="dot">Trade</span></div>
      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button type="button" role="tab" aria-selected="true" data-auth-tab="login">Log in</button>
        <button type="button" role="tab" aria-selected="false" data-auth-tab="register">Register</button>
      </div>

      <form id="form-login" data-auth-panel="login">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="ash@example.com" autocomplete="email" required />
        </div>
        <div class="field" style="margin-top: var(--space-3);">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--space-4);">Log in</button>
        <p class="field-hint" style="margin-top: var(--space-3); text-align:center;"><a href="#">Forgot your password?</a></p>
      </form>

      <form id="form-register" data-auth-panel="register" hidden>
        <div class="field">
          <label for="reg-name">Name</label>
          <input id="reg-name" placeholder="Ash" autocomplete="name" required />
        </div>
        <div class="field" style="margin-top: var(--space-3);">
          <label for="reg-email">Email</label>
          <input id="reg-email" type="email" placeholder="ash@example.com" autocomplete="email" required />
        </div>
        <div class="field" style="margin-top: var(--space-3);">
          <label for="reg-password">Password</label>
          <input id="reg-password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required />
        </div>
        <div class="field" style="margin-top: var(--space-3);">
          <span>How would you describe yourself?</span>
          <div class="pill-choice-group" role="group" aria-label="Collector experience">
            <button type="button" class="pill-choice" data-level="new" aria-pressed="true">New Trainer</button>
            <button type="button" class="pill-choice" data-level="collector" aria-pressed="false">Collector</button>
            <button type="button" class="pill-choice" data-level="pro" aria-pressed="false">Pro</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--space-4);">Create my account</button>
      </form>
    </div>
  </section>

  <script src="assets/app.js"></script>
  <script>
    var authTabs = document.querySelectorAll('[data-auth-tab]');
    authTabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        authTabs.forEach(function (t) { t.setAttribute('aria-selected', t === tab ? 'true' : 'false'); });
        document.getElementById('form-login').hidden = tab.dataset.authTab !== 'login';
        document.getElementById('form-register').hidden = tab.dataset.authTab !== 'register';
      });
    });
    document.querySelectorAll('.pill-choice').forEach(function (p) {
      p.addEventListener('click', function () {
        p.parentElement.querySelectorAll('.pill-choice').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
        p.setAttribute('aria-pressed', 'true');
      });
    });
    function enterApp(e) {
      e.preventDefault();
      PokeTradeProto.logIn();
      window.location.href = 'dashboard.html';
    }
    document.getElementById('form-login').addEventListener('submit', enterApp);
    document.getElementById('form-register').addEventListener('submit', enterApp);
  </script>
</body>
</html>
